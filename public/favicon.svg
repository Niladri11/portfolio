<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="50%" stop-color="#C8A96B"/>
      <stop offset="100%" stop-color="#8B7043"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="4"/>

  <!-- Inner border -->
  <rect width="104" height="104" x="8" y="8" rx="16" fill="none" stroke="url(#gold-grad)" stroke-width="1" opacity="0.3"/>

  <!-- NT Text -->
  <text x="60" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="-4" filter="url(#glow)">NT</text>
  
  <!-- Subtle tech dot -->
  <circle cx="60" cy="94" r="3" fill="#C8A96B" />
</svg>